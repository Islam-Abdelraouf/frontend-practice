<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 10</title>
    <link rel="stylesheet" href="layout_10_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <section>
        <div class="card">
            <div class="card__img">
                <img loading="lazy" src="images/12.4.jpg" alt="" srcset="">
            </div>
            <div class="card-content">
                <p class="card__price">
                    $ 120
                </p>
                <h2 class="card__title">
                    Card Title
                </h2>
                <p class="card__description">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad harum iusto laboriosam! Laboriosam
                    expedita impedit
                    quaerat saepe tenetur molestias natus amet, dolore, reiciendis rem repudiandae!
                </p>
                <button class="card__btn">
                    Submit
                </button>
            </div>
        </div>
    </section>

</body>

</html>
