<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 4</title>
    <link rel="stylesheet" href="layout_4_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="form-container">

        <h2 class="form-title">Evolutive Learning</h2>

        <form class="form">

            <input type="text" name="email" placeholder="Email" autofocus>
            <input type="password" name="password" placeholder="Password">
            <input type="submit" value="Sign in">

            <div class="form__social">
                <p class="form__social--title">or connect with</p>

                <ul class="form__social--buttons">
                    <li>
                        <i class="icon fa-brands fa-facebook"></i>
                        <a href="#"><span>facebook</span></a>
                    </li>
                    <li>
                        <i class="icon fa-brands fa-square-twitter"></i>
                        <a href="#"><span>twitter</span></a>
                    </li>
                    <li>
                        <i class="icon fa-brands fa-google"></i>
                        <a href="#"><span>google</span></a>
                    </li>
                </ul>
            </div>

            <div class="form__footer">
                <a href="#" class="form__footer--forget">forget password?</a>
                <p class="form__footer--register">not a member yet? &nbsp <a href="#">Register</a></p>
            </div>
            <!-- <div class="login-form__social--buttons">
                <div class="btn btn-facebook">

                </div>
                <div class="btn btn-twitter">

                </div>
                <div class="btn btn-google">
                </div>
            </div> -->
        </form>
    </div>
</body>

</html>
